<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Tik medicinos mergaitė</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a narrow study column; areas as coloured index tabs, the topic opens into three study modes */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18231f; --muted:#5d6b65; --line:#d9e0dc;
  --scrub:#1f6b5c; --scrub-soft:#dcefe9;
  --heart:#c2414b; --heart-soft:#f8e1e3;
  --lung:#2f62a8; --lung-soft:#e0eaf8;
  --mark:#ffe58a; --mark-ink:#2b2200;
  --hero:#18231f; --hero-ink:#f3f5f2; --hero-hl:#ffd75e;
  --good:#2f8a4e; --good-soft:#ddf2e3; --bad:#c2414b; --bad-soft:#f8e1e3; --warn:#b07a12; --warn-soft:#fbefd2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#17201d; --ink:#e6eeea; --muted:#9aaaa3; --line:#2a3632;
  --scrub:#5fc4ad; --scrub-soft:#173a33; --heart:#f0848c; --heart-soft:#3e1d21; --lung:#86b0ee; --lung-soft:#1b2a42;
  --mark:#6b5a12; --mark-ink:#fff5cc; --hero:#1d2a26; --hero-ink:#eef4f1; --hero-hl:#ffd75e; --good:#6fd08f; --good-soft:#18361f; --bad:#f0848c; --bad-soft:#3e1d21; --warn:#e7b858; --warn-soft:#3a2d10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#17201d; --ink:#e6eeea; --muted:#9aaaa3; --line:#2a3632;
  --scrub:#5fc4ad; --scrub-soft:#173a33; --heart:#f0848c; --heart-soft:#3e1d21; --lung:#86b0ee; --lung-soft:#1b2a42;
  --mark:#6b5a12; --mark-ink:#fff5cc; --hero:#1d2a26; --hero-ink:#eef4f1; --hero-hl:#ffd75e; --good:#6fd08f; --good-soft:#18361f; --bad:#f0848c; --bad-soft:#3e1d21; --warn:#e7b858; --warn-soft:#3a2d10;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;background-image:radial-gradient(900px 380px at 85% -120px,var(--heart-soft),transparent 70%),radial-gradient(800px 360px at -10% -80px,var(--scrub-soft),transparent 70%);background-repeat:no-repeat}
.hero{position:relative;border-radius:22px;padding:22px 20px 0;margin-bottom:20px;background:var(--hero);color:var(--hero-ink);overflow:hidden;border:1px solid var(--line)}
.hero .hi{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.hero h2{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.hero h2 em{font-style:normal;color:var(--hero-hl)}
.hero p{margin:6px 0 0;font-size:14px;opacity:.85;max-width:34em}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .stats span{font-size:12px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--hero-ink) 12%,transparent);border:1px solid color-mix(in srgb,var(--hero-ink) 22%,transparent)}
.hero .stats b{font-family:var(--display)}
.ecg{display:block;width:calc(100% + 40px);margin:14px -20px 0;height:56px}
.ecg path{fill:none;stroke:var(--heart);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:0;animation:beat 3.2s ease-in-out 1}
@keyframes beat{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.mode .ico{width:22px;height:22px;color:var(--muted)}
.mode[aria-pressed="true"] .ico{color:var(--scrub)}
.mode .row1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mode{transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--scrub)}
.mod{transition:transform .15s,border-color .15s,box-shadow .15s}
.mod:hover{transform:translateY(-2px);box-shadow:0 10px 30px -18px var(--scrub)}
.mod .trace{position:absolute;right:-10px;top:40px;width:200px;height:70px;opacity:.12;pointer-events:none}
.mod .trace path{fill:none;stroke:var(--heart);stroke-width:3}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.opt:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
a{color:var(--scrub)}
mark,.hl{background:var(--mark);color:var(--mark-ink);padding:0 .2em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--scrub);display:grid;place-items:center;flex:none}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:16px}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--scrub);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.crumbs .sep{opacity:.5}

/* mode switch */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
@media (max-width:560px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode.prog b{color:var(--scrub)}
/* modules */
.mods{display:grid;gap:14px}
.mod{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.mod::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--scrub) 0 33.3%,var(--heart) 33.3% 66.6%,var(--lung) 66.6% 100%)}
.mod .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mod .due{background:var(--scrub-soft);color:var(--scrub);padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.mod .due.late{background:var(--bad-soft);color:var(--bad)}
.mod h2{font-size:24px;font-weight:800;margin-top:10px;line-height:1.15}
.mod .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mod .meta span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.mod .foot{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:16px}
.mod .foot b{font-family:var(--display);font-size:20px;color:var(--scrub);font-variant-numeric:tabular-nums}
.mod .foot .sbar{margin:0}
.mod:hover{border-color:var(--scrub)}
/* progress */
.p-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:14px}
.p-big{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--scrub)}
.p-big small{font-size:22px}
.p-hero h2{font-size:19px;font-weight:700}
.p-hero p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.sbar{display:flex;height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.sbar i{display:block;height:100%}
.sbar .g{background:var(--good)} .sbar .y{background:var(--warn)}
.p-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.p-legend em{font-style:normal;display:inline-flex;gap:6px;align-items:center}
.p-legend em::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sw)}
.p-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;border-top:5px solid var(--c)}
.blk-head{padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.blk-head h3{font-size:19px;font-weight:700}
.blk-head .pct{font-family:var(--display);font-size:24px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.blk-head .sbar{grid-column:1/-1;margin-top:4px}
.blk-head .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:3.4em 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.trow .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.trow .tt{min-width:0;font-size:14px}
.trow .tt a{font-size:12px;margin-left:6px;white-space:nowrap}
.trow.s2 .tt{color:var(--muted)}
.st{border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;background:var(--bg);white-space:nowrap;min-width:6.6em;text-align:center}
.st.s1{background:var(--warn-soft);border-color:var(--warn)}
.st.s2{background:var(--good-soft);border-color:var(--good)}
@media (max-width:480px){.trow{grid-template-columns:2.8em 1fr}.trow .st{grid-column:2;justify-self:start}.p-big{font-size:42px}}
.mode{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode .ic{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode b{font-family:var(--display);font-size:16px;font-weight:700}
.mode span.n{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--scrub);background:var(--scrub-soft)}
.mode[aria-pressed="true"] .ic{color:var(--scrub)}

.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* areas */
.areas{display:grid;gap:12px}
.area{display:grid;grid-template-columns:8px 1fr auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0}
.area .tab{background:var(--c)}
.area .in{padding:16px 16px;min-width:0}
.area h3{font-size:20px;font-weight:700}
.area p{margin:4px 0 0;color:var(--muted);font-size:13px}
.area .go{display:grid;place-items:center;padding:0 16px;color:var(--c);font-family:var(--display);font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--cs);color:var(--ink);border:1px solid transparent}

.list{display:grid;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;width:100%}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.row .t{flex:1;min-width:0}
.row h4{font-size:17px;font-weight:700}
.row p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.row .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:20px;color:var(--muted);font-size:14px;background:transparent}
.empty b{color:var(--ink)}

/* topic */
.topic-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;border-top:6px solid var(--c)}
.topic-head .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.topic-head h2{font-size:24px;font-weight:800;margin-top:6px}
.topic-head p{margin:8px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* konspektas */
.notes{display:grid;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.box h3{font-size:19px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.box h3 .num{font-family:var(--mono);font-size:12px;color:var(--c);font-weight:500}
.box h4{font-size:15px;font-weight:700;margin:14px 0 6px}
.box p{margin:10px 0 0}
.box ul,.box ol{margin:8px 0 0;padding-left:20px}
.box li{margin:3px 0}
.tbl{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--cs);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
.tbl.narrow table{min-width:0}
.call{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px;border-left:5px solid var(--k);background:var(--ks)}
.call strong:first-child{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--k);margin-bottom:2px}
.call.exam{--k:var(--heart);--ks:var(--heart-soft)}
.call.tip{--k:var(--scrub);--ks:var(--scrub-soft)}
.call.extra{--k:var(--warn);--ks:var(--warn-soft)}
.tag-extra{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:4px;white-space:nowrap}
figure{margin:14px 0 0}
figure img{display:block;border-radius:10px;border:1px solid var(--line);background:#fff;max-height:420px;width:auto;max-width:100%;margin:0 auto}
figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.ladder{display:grid;gap:6px;margin-top:12px;counter-reset:st}
.ladder div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--cs);font-size:14px}
.ladder div::before{counter-increment:st;content:counter(st);font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center;flex:none}
.surv{display:grid;gap:10px;margin-top:12px}
.surv .r{display:grid;grid-template-columns:minmax(0,9.5em) 1fr;gap:10px;align-items:center;font-size:13px}
.bar{height:22px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:6px}
.bar span{position:relative;z-index:1;padding-left:8px;font-family:var(--mono);font-size:12px;line-height:22px;color:var(--ink)}
.bar i.dx{background:var(--muted);opacity:.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend em{font-style:normal;display:inline-flex;gap:6px;align-items:center}
.legend em::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--sw)}

/* cards */
.deck-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--scrub);border-color:var(--scrub);color:var(--surface)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.flash{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;min-height:240px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}
.flash .side{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash .q{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.3}
.flash .a{font-size:17px;border-top:1px dashed var(--line);padding-top:14px}
.flash .gap{display:inline-block;min-width:3.5em;border-bottom:2.5px solid var(--scrub);color:var(--scrub);text-align:center;font-family:var(--mono);font-size:.8em}
.flash .tags{margin-top:auto;font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-word}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rate .btn{padding:12px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--scrub);transition:width .25s}
.export{margin-top:22px}
.export textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}
.export .btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.note{font-size:13px;color:var(--muted)}

/* test */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.qcard .qn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qcard h4{font-family:var(--display);font-size:18px;font-weight:700;margin:6px 0 12px;line-height:1.3}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);text-align:left;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--scrub-soft)}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.score b{font-family:var(--display);font-size:18px}
.result{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:18px;margin-top:8px}
.result h3{font-size:22px}
.result p{margin:6px 0 0;opacity:.85}
@media (max-width:520px){.modes .mode b{font-size:14px}.flash .q{font-size:19px}.topic-head h2{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M6 12h3l1.5-2.5L13 15l1.5-3H18"/></svg>
      </div>
      <div><small>Konspektai · kortelės · testai</small><h1>Tik medicinos mergaitė</h1></div>
    </div>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Kelias"></nav>
  <div class="modes" id="modes" role="group" aria-label="Mokymosi būdas"></div>

<tr><td><b>Neverifikuotas pleuritas, neefektyvus gydymas</b></td><td>VATS pleuros biopsija</td></tr>
<tr><td><b>Darinys + padidėję tarpuplaučio / viršraktikauliniai limfmazgiai</b></td><td>Mediastinoskopija, mediastinotomija, periferinio limfmazgio biopsija</td></tr>
<tr><td><b>Darinys + pasieninės pleuros pakitimai</b></td><td>VATS</td></tr></table></div>
<div class="call extra"><strong>Atranka · papildyta</strong>Rezultatas turi keisti taktiką, mažiau invaziniai metodai (EBUS, transtorakalinė biopsija) turi būti neinformatyvūs, o pacientas turi toleruoti nejautrą ir vienplautę ventiliaciją. Renkamasi mažiausiai invazinė prieiga.</div>
</section>

<section class="box"><h3><span class="num">03</span>Diagnostikos metodai</h3>
<div class="tbl"><table><tr><th>Metodas</th><th>Nejautra</th><th>Prieiga</th><th>Ką biopsuojame</th></tr>
<tr><td><b>VATS</b></td><td>Bendrinė endotrachėjinė / endobronchinė</td><td><mark>2–3 pjūviai iki 2 cm</mark>, įvedami manipuliatoriai</td><td>Plautį, pleurą, tarpuplaučio darinį, limfmazgius</td></tr>
<tr><td><b>Mediastinoskopija</b></td><td>Bendrinė endotrachėjinė</td><td><mark>Pjūvis kakle</mark>, kanalas palei trachėjos priekinį paviršių</td><td><mark>Paratrachėjinius, tracheobronchinio kampo</mark> limfmazgius</td></tr>
<tr><td><b>Torakotomija</b></td><td>Bendrinė</td><td>Atviras pjūvis</td><td>Biopsija <b>akies kontrolėje</b></td></tr>
<tr><td><b>Mediastinotomija</b></td><td>Bendrinė endotrachėjinė / endobronchinė</td><td><mark>Pjūvis palei krūtinkaulį</mark>, atveriama pleuros ertmė</td><td>Tarpuplaučio darinį, limfmazgius</td></tr>
<tr><td><b>Periferinio limfmazgio biopsija</b></td><td><mark>i/v</mark> arba endotrachėjinė</td><td>Pjūvis virš limfmazgio</td><td>Visą limfmazgį arba jo dalį</td></tr></table></div>
<div class="call exam"><strong>Egzaminui</strong>Mediastinoskopu nepasiekiamos 5 ir 6 stotys (aortopulmoninis langas). Joms reikalinga mediastinotomija arba VATS <span class="tag-extra">papildyta</span>.</div>
</section>

<section class="box"><h3><span class="num">04</span>Rezekcinių operacijų tipai</h3>
<div class="tbl"><table><tr><th>Tipas</th><th>Apibrėžimas</th><th>Operacijos</th></tr>
<tr><td><b>Tipinės (anatominės)</b></td><td><mark>Atskirai sutvarkomi bronchai, arterijos ir venos</mark></td><td>Pulmonektomija (visas plautis), bilobektomija, <b>lobektomija</b> (skiltis), segmentektomija (segmentas), polisegmentektomija</td></tr>
<tr><td><b>Netipinės (neanatominės)</b></td><td>Arterijos, venos ir bronchas <mark>atskirai nesutvarkomi</mark></td><td>Kraštinė, kylinė rezekcija, ekscizija (išpjovimas), enukleacija (išgliaudymas)</td></tr>
<tr><td><b>Išplėstinės</b></td><td>Kartu su plaučio dalimi <mark>pašalinama ir dalis kitų krūtinės organų</mark></td><td>Pvz., su krūtinės siena, perikardu <span class="tag-extra">papildyta</span></td></tr></table></div>
</section>

<section class="box"><h3><span class="num">05</span>Prieigos: atvira, VATS, robotinė</h3>
<p>Visas operacijas galima atlikti <b>torakotomija</b>. Vis dažniau taikomos <b>mažai invazinės</b> operacijos: torakoskopinės ir robotinės (hibridinės).</p>
<ul>
<li><b>VATS:</b> optika, monitorius, papildomi šviesos šaltiniai, specialūs instrumentai. <mark>Tarpšonkaulinis tarpas nėra plečiamas.</mark> Prireikus daromi papildomi pjūviai.</li>
<li><b>Robotinė (RATS):</b> manipuliacijos atliekamos <mark>nuotoliniu būdu</mark>, manipuliatorių ergonomika geresnė, chirurgas mato <mark>trimatį (3D) vaizdą</mark>.</li>
<li><span class="tag-extra">papildyta</span> VATS pagal portų skaičių: <b>3 portai</b> (klasikinė, „trikampė“ geometrija), <b>2 portai</b>, <b>1 portas</b> (uniportal, vienas 3–5 cm pjūvis).</li>
</ul>
<figure><img src="${IMG.vats}" alt="VATS lobektomijos iliustracija"><figcaption><b>VATS kairiosios apatinės skilties lobektomija.</b> LUL (kairioji viršutinė skiltis) atitraukta į viršų. Tarpskiltelinis plyšys perskirtas siuvimo aparatu (GIA). LLL (kairioji apatinė skiltis) per asistento portą atitraukiama žemyn.</figcaption></figure>
<figure><img src="${IMG.robot}" alt="Robotinė chirurginė sistema"><figcaption><b>Robotinė sistema operacinėje:</b> 4 manipuliatorių rankos sterilioje dangoje. Chirurgas jas valdo nuo atskiros konsolės.</figcaption></figure>
</section>

<section class="box"><h3><span class="num">06</span>Radikalumas ir paliatyvios operacijos</h3>
<p><mark>Pagrindinis tikslas yra radikalumas. Minimali radikalios operacijos apimtis yra lobektomija.</mark></p>
<h4>Radikalios operacijos kriterijai</h4>
<ol>
<li>Broncho ir kitų darinių <mark>rezekcijos kraštuose nėra navikinės infiltracijos</mark>.</li>
<li>Pašalinti sritiniai <b>N2</b> limfmazgiai.</li>
<li>Ištirta <mark>ne mažiau kaip 6 limfmazgiai iš kiekvienos lokalizacijos</mark>, ir pakitimų nerasta.</li>
</ol>
<div class="call exam"><strong>Kodėl ne mažiau nei lobektomija?</strong>Po netipinės rezekcijos ar segmentektomijos <b>intrapulmoniniuose limfmazgiuose ir limfagyslėse gali likti metastazių</b>.</div>
<h4>Paliatyvi (palaikomoji) rezekcija</h4>
<p>Atliekama, kai <b>radikali operacija keltų per didelę riziką</b> arba kai operuojama <b>gelbstint gyvybę</b>.</p>
<h4>Metodo pasirinkimą lemia</h4>
<ul><li>stadija</li><li>tarpuplaučio limfmazgių būklė</li><li>darinio dydis ir lokalizacija</li><li>plaučių ir širdies funkcija</li></ul>
<div class="call exam"><strong>Spąstai</strong><mark>Amžius NĖRA pasirinkimą lemiantis veiksnys.</mark></div>
<figure><img src="${IMG.ln}" alt="Limfmazgių stotys"><figcaption><b>Limfmazgių stotys.</b> <mark>2–9 stotys yra N2 (tarpuplautis), 10–14 stotys yra N1 (šaknis ir plautis).</mark> 4R/4L yra apatiniai paratrachėjiniai, 7 – subkarininiai, 5 – aortopulmoninio lango, 6 – paraaortiniai limfmazgiai.</figcaption></figure>
</section>

<section class="box"><h3><span class="num">07</span>TNM stadijos ir operabilumas</h3>
<div class="tbl"><table><tr><th>Stadija</th><th>T</th><th>N</th><th>M</th></tr>
<tr><td>0</td><td>Tis</td><td>N0</td><td>M0</td></tr>
<tr><td>IA1–IA3</td><td>T1mi, T1a / T1b / T1c</td><td>N0</td><td>M0</td></tr>
<tr><td>IB</td><td>T2a*</td><td>N0</td><td>M0</td></tr>
<tr><td>IIA</td><td>T2b</td><td>N0</td><td>M0</td></tr>
<tr><td>IIB</td><td>T1–T2 / T3</td><td>N1 / N0</td><td>M0</td></tr>
<tr style="border-top:3px solid var(--bad)"><td><b>IIIA</b></td><td>T1–T2 / T3 / T4</td><td>N2 / N1 / N0–N1</td><td>M0</td></tr>
<tr><td>IIIB</td><td>T1–T2 / T3–T4</td><td>N3 / N2</td><td>M0</td></tr>
<tr><td>IIIC</td><td>T3, T4</td><td>N3</td><td>M0</td></tr>

<p class="note">* Skaidrėje prie IB nurodyta T2b. Pagal 8-ąją TNM redakciją IB = T2a N0.</p>
</section>

<section class="box"><h3><span class="num">08</span>Funkcija, anestezija, komplikacijos <span class="tag-extra">papildyta</span></h3>
<h4>Funkcinis įvertinimas</h4>
<ul><li>Pirmiausia įvertinama širdies rizika, tada <b>FEV1 ir DLCO</b>, iš jų apskaičiuojamos ppo vertės.</li>
<li><mark>ppo &gt; 60 %</mark>: maža rizika · 30–60 %: krūvio mėginys · <mark>&lt; 30 %</mark>: VO2max.</li>
<li><mark>VO2max &gt; 20 ml/kg/min</mark>: saugu iki pulmonektomijos · <mark>&lt; 10</mark>: didelė rizika.</li></ul>
<h4>Anestezija</h4>
<ul><li><mark>Vienplautė ventiliacija (OLV)</mark> per <b>dvispindį vamzdelį (DLT)</b> arba bronchų blokatorių.</li>
<li>Pagrindinė rizika yra <b>hipoksemija</b> dėl šunto. Organizmą gina hipoksinė plaučių vazokonstrikcija.</li>
<li>Taikoma protekcinė ventiliacija, ribota skysčių terapija ir epidurinė / paravertebrinė analgezija.</li></ul>
<h4>Komplikacijos</h4>
<div class="tbl"><table><tr><th>Komplikacija</th><th>Esmė</th></tr>
<tr><td><b>Ilgalaikis oro pratekėjimas</b></td><td>Dažniausia</td></tr>
<tr><td><b>Bronchopleurinė fistulė</b></td><td>Pavojingiausia, ypač po dešiniosios pulmonektomijos</td></tr>
<tr><td>Kraujavimas</td><td>&gt; 200 ml/val. → retorakotomija</td></tr>
<tr><td>Atelektazė, pneumonija</td><td>Prevencija: analgezija, kineziterapija</td></tr>
<tr><td>Prieširdžių virpėjimas</td><td>2–3 parą</td></tr>
<tr><td>Empiema, plaučių edema, PE</td><td>Ribota skysčių terapija, tromboprofilaktika</td></tr></table></div>
</section>

<section class="box"><h3><span class="num">09</span>Rezekcijų indikacijos, metastazės, emfizema</h3>
<ul><li><b>Plaučių vėžys</b></li><li><b>Emfizema:</b> spontaninis pneumotoraksas, plaučių tūrį mažinančios operacijos</li><li><b>Gerybiniai plaučių navikai</b></li><li><b>Infekcinės ligos</b>, kai konservatyvus gydymas neefektyvus</li><li><b>Lėtinės ligos, komplikuotos kraujavimu ar destrukcija</b></li></ul>
<h4>Metastazių chirurgija</h4>
<p><mark>Torakoskopija + kraštinė arba kylinė rezekcija.</mark></p>
<h4>Emfizema</h4>
<p>Chirurgiškai gydoma <mark>emfizema, komplikuota pneumotoraksu</mark>: bulų pašalinimas, bulų invaginacija, kraštinė / kylinė rezekcija ir pleurektomija. Torakoskopiją ar torakotomiją pasirinkti lemia <b>paciento būklė ir chirurgo patirtis</b>.</p>
</section>

<section class="box"><h3><span class="num">10</span>Pleuros ligos</h3>
<p>Chirurgiškai gydomi: <b>pneumotoraksas, hemotoraksas, pleuros empiema, fibrotoraksas, vėžinis pleuritas</b>.</p>
<h4>Eskalacijos laiptai</h4>
<div class="ladder"><div>Pleuros ertmės punkcija</div><div>Pleuros ertmės drenavimas</div><div>Torakoskopija (diagnostika)</div><div>Torakoskopija (gydymas): pleurektomija, dekortikacija</div><div>Pleurostomija</div><div>Pleurostomos plastika</div></div>
<div class="tbl"><table><tr><th>Operacija</th><th>Apibrėžimas</th></tr>
<tr><td><b>Pleurektomija</b></td><td><mark>Patologiškai pakitusios pasieninės pleuros pašalinimas</mark></td></tr>
<tr><td><b>Dekortikacija</b></td><td><mark>Fibrino ir uždegimo produktų „šarvo“ pašalinimas nuo visceralinės pleuros</mark></td></tr>
<tr><td><b>Talko pleurodezė</b> <span class="tag-extra">papildyta</span></td><td>Torakoskopinis talko „pudravimas“ sukelia pleuros lapų suaugimą. Taikoma esant vėžiniam pleuritui. Būtina sąlyga: plautis turi prasiplėsti</td></tr></table></div>
<div class="call exam"><strong>Pneumotorakso operacijos indikacijos</strong><b>Antras kartas toje pačioje pusėje · pirmas kartas kitoje pusėje · abipusis · spontaninis pneumohemotoraksas · profesinė rizika (pilotai, narai) · nėštumas.</b></div>
<h4>Sunkios būklės pacientams</h4>
<ul><li>Endobronchinės procedūros: vožtuvai, fibrino klijai, sklerozantai</li><li>Aktyvaus siurbimo sistemos: pastovus neigiamas slėgis, <b>Heimlicho vožtuvas</b></li><li>Cheminė pleurodezė: tetraciklinas, doksiciklinas, minociklinas</li><li>Torakoskopija ir defekto padengimas fibrino klijais</li><li>Retais atvejais torakotomija</li></ul>
</section>`;

<p>Pagrindinis patofiziologinis principas: <mark>miokardo deguonies poreikio ir tiekimo disbalansas</mark>. Miokardo perfuzija vyksta daugiausia <mark>diastolės metu</mark>, todėl tachikardija (trumpėjanti diastolė) skatina išemiją. Dėl sluoksninio kraujotakos pasiskirstymo pirmiausia nukenčia subendokardas, todėl EKG ryškėja <mark>ST segmento nusileidimas</mark>. Išemija gali būti ir be skausmo, t. y. <mark>tylioji (beskausmė) išemija</mark>.</p>

<tr><td><b>Kostochondritas</b></td><td>Lokalus skausmas, stiprėja spaudžiant</td></tr>
<tr><td><b>Juostinė pūslelinė</b></td><td>Juostinis bėrimas, neuropatinis skausmas dermatome</td></tr>
<tr><td><b>Panikos ataka</b></td><td>Greitas kvėpavimas, baimė, tirpimas</td></tr></table></div>
</section>

<section class="box"><h3><span class="num">10</span>Gydymas</h3>
<h4>Tikslai</h4>
<ul><li>Sumažinti išemijos simptomus</li><li>Pagerinti gyvenimo kokybę ir funkcinį pajėgumą</li><li>Sumažinti infarktų, insultų, mirties riziką</li><li>Sulėtinti VAL progresavimą</li><li>Užtikrinti antrinę prevenciją</li></ul>
<h4>Nemedikamentinis gydymas</h4>
<ul><li><b>Visiškai nerūkyti</b></li><li>Sočiųjų riebalų &lt; 10 % paros kalorijų, alkoholio &lt; 100 g per savaitę, druskos ≤ 5–6 g/d.</li><li>Fizinis aktyvumas 30–60 min. daugumą dienų</li><li>KMI &lt; 25 kg/m²</li><li>Psichologinė pagalba esant depresijai, kasmetinis gripo skiepas</li></ul>
<div class="call exam"><strong>1. Antianginiai vaistai</strong><b>Beta adrenoblokatoriai – pirmo pasirinkimo</b> (mažina širdies darbą ir O2 poreikį) · KKB, jei BAB netoleruojami ar nepakanka · nitratai trumpalaikiam palengvinimui · ivabradinas, jei BAB kontraindikuotini ar neveiksmingi</div>
<div class="call tip"><strong>2. Progresavimo lėtinimas</strong><b>Statinai</b>: MTL &lt; 1,4 mmol/l ir ≥ 50 % sumažinimas · <b>AKFI / ARB</b> (ypač AH, CD, ŠN) · <b>aspirinas 75–100 mg</b> (klopidogrelis, jei netoleruoja) <mark>visiems po MI ar revaskuliarizacijos visą gyvenimą</mark> · rivaroksabanas 2,5 mg × 2 k./d. esant didelei rizikai · CD atveju SGLT2i, GLP-1 RA</div>
<div class="tbl"><table><tr><th>Vaistų deriniai</th><th>Principas</th></tr>
<tr><td>Beta blokatoriai</td><td>Kontraindikuotini: sunki LOPL, periferinė arterijų liga, I tipo CD, sinusinio mazgo silpnumas</td></tr>
<tr><td>Dihidropiridino KKB</td><td>Tinka su BAB; kontraindikuotini esant HFrEF</td></tr>
<tr><td>Nitratai / nikorandilis</td><td>Tinka su BAB ar KKB; kontraindikuotini esant HKMP</td></tr>
<tr><td>Diltiazemas / verapamilis + ivabradinas</td><td><mark>Nerekomenduojama</mark> (bradikardijos rizika)</td></tr></table></div>
<h4>Kaip nutraukti krūtinės anginos priepuolį</h4>
<div class="ladder"><div>Nutraukti fizinį krūvį</div><div>Nitroglicerinas po liežuviu 0,5 mg (veikia per 1–3 min, pikas 2–8 min, trukmė 10–30 min)</div><div>Kartoti po 4–5 min, iki 3 kartų</div><div>Jei trunka <mark>&gt; 20 min</mark>, įtarti ūminį išemijos sindromą</div></div>
</section>

<section class="box"><h3><span class="num">11</span>Revaskuliarizacija</h3>
<p>Svarstoma, kai nepavyksta kontroliuoti simptomų optimaliu medikamentiniu gydymu arba yra didelė išemijos zona ar sumažėjusi KS funkcija.</p>
<div class="tbl"><table><tr><th>Tikslas</th><th>Kriterijai</th></tr>
<tr><td><b>Prognozei gerinti</b></td><td>Kamieno stenozė &gt; 50 % · proksimali PTŠ stenozė &gt; 50 % · 2 ar 3 VA liga su stenozėmis &gt; 50 % ir KS IF ≤ 35 % · išemijos zona &gt; 10 % KS ar patologinis FFR · vienintelės likusios VA stenozė &gt; 50 %</td></tr>
<tr><td><b>Simptomams mažinti</b></td><td>Bet kurios VA stenozė &gt; 50 %, kai medikamentinis gydymas neefektyvus</td></tr></table></div>
<div class="tbl"><table><tr><th>PVAI</th><th>AVAJO renkamasi, kai</th></tr>
<tr><td>Greita, mažiau invazyvi</td><td>Dauginė VA liga · kamieno pažaida &gt; 50 % · proksimalinė PTŠ pažaida · diabetas · KS IF ≤ 35 % · reikia kitos širdies operacijos · kontraindikuotini du antiagregantai</td></tr></table></div>
<p>Metodą lemia <mark>SYNTAX balas</mark>, gretutinės ligos ir Širdies komandos sprendimas.</p>
<h4>Antiagregantai po PVAI</h4>
<ul><li>Sinusinis ritmas, maža kraujavimo rizika: aspirinas + klopidogrelis <mark>6 mėn.</mark>, vėliau aspirinas ilgam.</li><li>Didelė kraujavimo rizika: DAPT 3 mėn. (labai didelė – 1 mėn.).</li><li>Sudėtingas stentavimas: aspirinas + prasugrelis arba tikagreloras.</li><li>PV + PVAI: triguba terapija 1 sav. (iki 1 mėn.), tada dviguba iki 6–12 mėn.</li><li>Kartu PSI, jei didelė VTT kraujavimo rizika.</li></ul>
<h4>Lėtinė okliuzija (CTO)</h4>
<p>Atvėrimas svarstomas, kai angina išlieka nepaisant gydymo, išemijos zona didelė ir miokardas gyvybingas. <b>Nerekomenduojama</b> besimptomiams be didelės išemijos, esant didelei rizikai ar negyvybingam miokardui.</p>
<div class="tbl"><table><tr><th>Grupė</th><th>Ypatumai</th></tr>
<tr><td>Moterys</td><td>Dažnesnė INOCA, netipiniai simptomai</td></tr>
<tr><td>Diabetas</td><td>Difuzinė VA liga; SGLT2i ir GLP-1 RA pirmiausia</td></tr>
<tr><td>Inkstų nepakankamumas</td><td>Ribota KT angiografija; vaistų dozių korekcija</td></tr>
<tr><td>Senyvas amžius</td><td>Individualus gydymas</td></tr></table></div>
</section>

<ul><li><b>Įtariant baltojo chalato AH</b>: I° AH kabinete, didelis AKS be OTP.</li>
<li><b>Įtariant slaptąją AH</b>: didelis normalus AKS kabinete, arba normalus AKS, bet yra OTP ar didelė KV rizika.</li>
<li><b>Gydomiems</b>: atspariai AH patvirtinti, hipotenzijai nustatyti.</li>
<li><b>Specialios PAKS indikacijos</b>: miego apnėja, LIL, CD, endokrininė AH, nėštumas.</li></ul>

<section class="box"><h3><span class="num">07</span>Ištyrimo planas ir diagnozė</h3>
<div class="ladder"><div><b>Įprastiniai tyrimai</b> (rizikos veiksniams): Hb, glikemija / HbA1c, lipidograma, K⁺/Na⁺, šlapimo rūgštis, kreatininas su eGFR, kepenų fermentai, BŠT, albumino / kreatinino santykis, 12 derivacijų EKG; nuo 2023 m. ir Ca²⁺</div><div><b>Rekomenduojami</b> (OTP): echokardiografija, miego arterijų UG, proteinurija, KŽI, akių dugnas, PBG, Holteris, inkstų / pilvo aortos UG</div><div><b>Išplėstinis</b> (antrinei AH): pažaidos paieška, renino / aldosterono / kortikosteroidų / katecholaminų koncentracijos, angiografija, KT / MRT</div></div>
<div class="call exam"><strong>Diagnozės formulavimas</strong>Pirminė AH + <mark>STADIJA</mark> + <mark>LAIPSNIS</mark> + <mark>RIZIKA</mark> + OTP + ŠN (jei yra). Pvz.: <i>2 stadijos, III laipsnio labai didelės rizikos pirminė arterinė hipertenzija. Hipertenzinė kardiopatija. ŠN, B stadija.</i></div>
</section>

<section class="box"><h3><span class="num">08</span>Antrinė hipertenzija</h3>
<div class="call extra"><strong>Kada įtarti</strong>Jauni (&lt; 40 m.) su 2–3 laipsnio AH; staigi AH pradžia; anksčiau gerai gydyta, bet staiga nekontroliuojama AH; tikroji atspari AH; hipertenzinė krizė; didelė OTP ir AKS disproporcija; endokrininės, renovaskulinės ar miego apnėjos klinika; sunki AH nėštumo metu.</div>
<div class="tbl"><table><tr><th>Priežastis</th><th>Paplitimas</th><th>Požymiai</th><th>1-asis tyrimas</th></tr>
<tr><td><b>Pirminis hiperaldosteronizmas</b></td><td>6–20 %</td><td>Atspari AH, <mark>hipokalemija</mark>, PV, miego apnėja</td><td><mark>Aldosterono / renino santykis (ARR)</mark></td></tr>
<tr><td><b>Aterosklerozinė inkstų kraujagyslių liga</b></td><td>6–14 %</td><td>Atspari AH, staigi plaučių edema, inkstų funkcijos blogėjimas skiriant AKFI / ARB</td><td>Inkstų arterijų dupleksinė echoskopija</td></tr>
<tr><td><b>Kušingo sindromas</b></td><td>2–5 %</td><td>„Mėnulio“ veidas, centripetalinis nutukimas, proksimalinė miopatija, CD</td><td>Naktinis 1 mg deksametazono supresijos testas</td></tr>
<tr><td><b>FMD</b></td><td>&lt; 1–6 %</td><td>Ankstyva / sunki AH, migrena, pulsuojantis spengimas ausyse</td><td>Inkstų arterijų dupleksinė echoskopija; gydymas – angioplastika be stento</td></tr>
<tr><td><b>Feochromocitoma / paraganglioma</b></td><td>&lt; 1 %</td><td>Priepuoliniai simptomai (galvos skausmas, prakaitavimas, plakimas), didelė AKS variacija</td><td><mark>Plazmos ar šlapimo laisvieji metanefrinai</mark></td></tr></table></div>
</section>

<section class="box"><h3><span class="num">09</span>Gydymo principai ir tikslai</h3>
<div class="call exam"><strong>Kada pradėti gydyti</strong>18–79 m., kai AKS <mark>&gt; 140/90</mark>; ≥ 80 m., kai SAKS <mark>&gt; 160</mark>; esant KSH ar kitai OTP – jau nuo <mark>≥ 130/80</mark>.</div>
<div class="tbl"><table><tr><th>Amžius</th><th>Pradinis tikslas</th><th>Siektinas, jei toleruojama</th></tr>
<tr><td>18–64 m.</td><td><mark>&lt; 130/80</mark></td><td></td></tr>
<tr><td>65–79 m.</td><td>&lt; 140/80</td><td>&lt; 130/80</td></tr>
<tr><td>65–79 m., izoliuota sistolinė AH</td><td>SAKS 140–150, DAKS &lt; 80</td><td>SAKS 130–139</td></tr>
<tr><td>≥ 80 m.</td><td>SAKS 140–150</td><td>130–139</td></tr></table></div>
<p>Trumpalaikis tikslas: <mark>per 3 mėn.</mark> pasiekti tikslinį AKS. Ilgalaikis: užkirsti kelią OTP ir sumažinti KV riziką.</p>
<div class="call tip"><strong>Statinai</strong>Vidutinės ar didesnės rizikos pacientams statinai skiriami net normalizavus AKS: MI rizika sumažėja apie trečdaliu, insulto – apie ketvirtadaliu.</div>
</section>

<section class="box"><h3><span class="num">10</span>Gyvensenos keitimas</h3>
<div class="tbl"><table><tr><th>Priemonė</th><th>Rekomendacija</th><th>AKS ↓</th></tr>
<tr><td>Svorio mažinimas</td><td>KMI 18,5–24,9</td><td>5–20 mmHg / 10 kg</td></tr>
<tr><td>Mityba</td><td>Daug vaisių, daržovių, mažai riebalų</td><td>8–14 mmHg</td></tr>
<tr><td>Na⁺ ribojimas</td><td><mark>&lt; 2,4 g Na (6 g NaCl) per parą</mark></td><td>2–8 mmHg</td></tr>
<tr><td>Fizinis aktyvumas</td><td>Aerobiniai &gt; 30 min/d.</td><td>4–9 mmHg</td></tr>
<tr><td>Alkoholis</td><td>&lt; 2 vnt./d. vyrams, &lt; 1 vnt./d. moterims</td><td>2–4 mmHg</td></tr></table></div>
<p>2300 mg Na = 100 mmol Na = 5,8 g druskos = 1 arbatinis šaukštelis. ~80 % druskos gaunama iš pagaminto maisto.</p>
</section>

<section class="box"><h3><span class="num">11</span>Vaistai ir gydymo algoritmas</h3>
<div class="call exam"><strong>Egzamino akcentas</strong>Daugumai pacientų gydymas pradedamas <mark>dviejų vaistų deriniu</mark>, pageidautina vienoje tabletėje (SPC). Monoterapija tik atrinktiems: maža rizika ir AKS &lt; 150/95, didelis normalus AKS su labai didele KV rizika, trapūs ar pagyvenę.</div>
<div class="ladder"><div><b>Dvigubas derinys</b>: AKFI arba ARB + KKB arba T/TL diuretikas (kontroliuoja ~60 %)</div><div><b>Trigubas derinys</b>: AKFI / ARB + KKB + diuretikas (~90 %)</div><div><b>Atspari AH (~5 %)</b>: pridėti <mark>spironolaktoną</mark> (ar kitą MRA), arba BAB / alfa-1 blokatorių, arba centrinio veikimo vaistą</div></div>
<p><b>BAB</b> skiriami bet kuriame žingsnyje esant papildomų indikacijų: IŠL, ŠN, PV, nėštumo planavimas.</p>
<div class="tbl"><table><tr><th>Vaistų klasė</th><th>Absoliučios kontraindikacijos</th><th>Santykinės</th></tr>
<tr><td>Tiazidiniai diuretikai</td><td><mark>Podagra</mark></td><td>Metabolinis sindromas, gliukozės netoleravimas, nėštumas, hipokalemija</td></tr>
<tr><td>Beta blokatoriai</td><td><mark>Astma</mark>, II–III° AV blokada, bradikardija (&lt; 60)</td><td>Metabolinis sindromas, sportininkai</td></tr>
<tr><td>KKB (dihidropiridiniai)</td><td>—</td><td>Tachiaritmija, ŠN su ↓ IF, kojų edema</td></tr>
<tr><td>KKB (verapamilis, diltiazemas)</td><td>II–III° AV blokada, KS disfunkcija, bradikardija</td><td>Vidurių užkietėjimas</td></tr>
<tr><td>AKFI</td><td><mark>Nėštumas, angioedema</mark>, hiperkalemija, dvišalė inkstų arterijų stenozė</td><td>Galimas nėštumas</td></tr>
<tr><td>ARB</td><td>Nėštumas, hiperkalemija, dvišalė inkstų arterijų stenozė</td><td>Galimas nėštumas</td></tr></table></div>
</section>

<section class="box"><h3><span class="num">12</span>Gydymas pagal gretutines ligas</h3>
<div class="tbl"><table><tr><th>Būklė</th><th>Pradinis derinys</th></tr>
<tr><td>KS hipertrofija</td><td>AKFI (ARB) + BAB; esant anginai + DHP-KKB</td></tr>

</section>

<section class="box"><h3><span class="num">13</span>Gydymui atspari hipertenzija</h3>
<div class="call exam"><strong>Apibrėžimas</strong><mark>Rezistentinė AH</mark>: tikslinis AKS nepasiekiamas optimaliomis dozėmis vartojant <b>trijų vaistų derinį (vienas jų – diuretikas)</b> arba pasiekiamas tik vartojant ≥ 4 vaistus.</div>
<p>Pirmiausia paneigti <mark>pseudorezistentinę AH</mark>: netinkamą matavimą, baltojo chalato efektą, prastą gydymo laikymąsi (iki 40–47 % „atsparių“ pacientų nevartoja vaistų).</p>
<p><b>Mechanizmai</b>: skysčių perteklius (Na⁺ susilaikymas), aktyvuota RAAS / SNS, padidėjęs arterijų standumas.</p>
<div class="ladder"><div>Griežtesnė gyvensena (ypač Na⁺ ribojimas)</div><div>Pridėti <mark>spironolaktono</mark> mažomis dozėmis</div><div>Netoleruojant: eplerenonas, amiloridas, kilpinis diuretikas ar didesnė T/TL dozė</div><div>Bisoprololis arba doksazosinas; LIL 4–5 st. – chlortalidonas</div><div>eGFR &gt; 40: apsvarstyti inkstų denervaciją</div></div>
</section>

function daysLeft(iso){ const t=new Date(); const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); const [y,mo,d]=iso.split("-").map(Number); return Math.round((Date.UTC(y,mo-1,d)-a)/864e5); }
function dueLabel(iso){ const [y,mo,d]=iso.split("-").map(Number); const mon=["sausio","vasario","kovo","balandžio","gegužės","birželio","liepos","rugpjūčio","rugsėjo","spalio","lapkričio","gruodžio"].at(mo-1); const n=daysLeft(iso); return {txt:`iki ${mon} ${d} d. · `+(n>0?`liko ${n} d.`:n===0?"šiandien":"baigėsi"), late:n<0}; }
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const allTopics = a => a.subs ? a.subs.flatMap(s=>s.topics) : a.topics;
const count = (topics, mode) => topics.reduce((n,t)=> n + (mode==="notes"?1: mode==="cards"? expandCards(t.cards).length : t.test.length), 0);
const unit = mode => mode==="notes"?"konsp.":mode==="cards"?"kort.":"klaus.";

function expandCards(cards){
  const out=[];
  cards.forEach((c,i)=>{
    if(c.t==="qa"){out.push({key:i+"", q:esc(c.q), a:esc(c.a), tags:c.tags});return;}
    const ns=[...new Set([...c.x.matchAll(/\{\{c(\d+)::/g)].map(m=>m[1]))];
    ns.forEach(n=>{
      const q=esc(c.x).replace(/\{\{c(\d+)::(.*?)\}\}/g,(m,k,v)=> k===n?'<span class="gap">[...]</span>':v);
      const a=esc(c.x).replace(/\{\{c(\d+)::(.*?)\}\}/g,(m,k,v)=> k===n?'<mark>'+v+'</mark>':v);
      out.push({key:i+"-"+n, q, a, tags:c.tags});
    });
  });
  return out;
}

function renderModes(){
  $("#modes").innerHTML = MODES.map(m=>{
    const M=curMod();
    if(m.id==="progress"){ const s=M?progStats(M.syl.flatMap(b=>b.items),M):progAll(); return `<button class="mode prog" data-mode="progress" aria-pressed="${st.mode==="progress"}"><span class="row1"><span class="ic">${m.ic}</span>${ICO.progress}</span><b>${m.name}</b><span class="n">${s.pct} % išmokta</span></button>`; }
    const total = (M?[M]:MODULES).reduce((n,mm)=>n+count(modTopics(mm),m.id),0);
    return `<button class="mode" data-mode="${m.id}" aria-pressed="${st.mode===m.id}"><span class="row1"><span class="ic">${m.ic}</span>${ICO[m.id]}</span><b>${m.name}</b><span class="n">${total} ${unit(m.id)}</span></button>`;
  }).join("");
  $("#modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode; render();});
}

function renderCrumbs(){
  const parts=[{label:"Moduliai",go:()=>{st.module=st.area=st.sub=st.topic=null}}];
  const M=curMod();
  if(M) parts.push({label:M.name,go:()=>{st.area=st.sub=st.topic=null}});
  const a=M&&st.mode!=="progress"&&M.areas.find(x=>x.id===st.area);
  if(a) parts.push({label:a.name,go:()=>{st.sub=st.topic=null}});
  const s=a&&a.subs&&a.subs.find(x=>x.id===st.sub);
  if(s) parts.push({label:s.name,go:()=>{st.topic=null}});
  const el=$("#crumbs"); el.innerHTML="";
  if(parts.length===1){el.hidden=true;return} el.hidden=false;
  parts.forEach((p,i)=>{
    if(i) el.insertAdjacentHTML("beforeend",'<span class="sep">/</span>');
    const b=document.createElement("button"); b.textContent=p.label; b.onclick=()=>{p.go();render()}; el.appendChild(b);
  });
}

function rowsFor(topics, a){
  if(!topics.length) return `<div class="empty"><b>Čia dar tuščia.</b> Įkelk paskaitos skaidres į pokalbį su Claude, ir čia atsiras konspektas, kortelės bei testas.</div>`;
  return `<div class="list">${topics.map(t=>`<button class="row" data-topic="${t.id}" style="--c:${a.c}"><span class="dot"></span><span class="t"><h4>${esc(t.title)}</h4><p>${esc(t.src)}</p></span><span class="cnt">${count([t],st.mode)} ${unit(st.mode)}</span></button>`).join("")}</div>`;
}

  v.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.tab;render()});
  const pane=$("#pane");
  if(st.mode==="notes") pane.innerHTML=`<div class="notes">${t.notes}</div>`;
  else if(st.mode==="cards") renderCards(pane,t);

/* ---------- kortelių peržiūra ---------- */
function renderCards(pane,t){
  const all=expandCards(t.cards);
  const sk="known:"+t.id;
  let known=new Set(store.get(sk,[]));
  let onlyNew=false, order=all.map((_,i)=>i), pos=0, shown=false;
  const pool=()=>order.filter(i=>!onlyNew||!known.has(all[i].key));
  function draw(){
    const p=pool();
    const done=known.size;
    let card;
    if(!p.length){ card=`<div class="flash"><span class="side">Viskas</span><div class="q">Visos kortelės pažymėtos kaip mokamos.</div><p class="note">Išjunk filtrą arba pradėk iš naujo.</p></div>`; }
    else{
      if(pos>=p.length) pos=0;
      const c=all[p[pos]];
      card=`<button class="flash" id="flip" aria-live="polite"><span class="side">${shown?"Atsakymas":"Klausimas"} · ${pos+1} / ${p.length}</span><div class="q">${c.q}</div>${shown?`<div class="a">${c.a}</div>`:`<p class="note">Bakstelk, kad pamatytum atsakymą</p>`}<div class="tags">${esc(c.tags)}</div></button>
      ${shown?`<div class="rate"><button class="btn bad" id="no">Nemoku</button><button class="btn good" id="yes">Moku</button></div>`:""}`;
    }
    pane.innerHTML=`<div class="deck-bar"><span class="pill">Moku ${done} iš ${all.length}</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="filter">${onlyNew?"Rodyti visas":"Tik nemokamos"}</button><button class="btn" id="shuf">Sumaišyti</button><button class="btn" id="reset">Iš naujo</button></span></div>
    <div class="progress"><i style="width:${all.length?done/all.length*100:0}%"></i></div>${card}
    <div class="export"><p class="section-label">Eksportas į Anki</p>
    <p class="note">„Basic“ kortelėms Anki pasirink tipą <b>Basic</b>, „Cloze“ kortelėms – <b>Cloze</b>. Laukus atskiria tabuliacija, 3-iasis laukas yra žymos (Tags).</p>
    <div class="btns"><button class="btn primary" id="cpq">Kopijuoti Basic (${t.cards.filter(c=>c.t==="qa").length})</button><button class="btn primary" id="cpc">Kopijuoti Cloze (${t.cards.filter(c=>c.t==="cloze").length})</button></div>
    <textarea id="exp" readonly aria-label="Eksporto tekstas" hidden></textarea><p class="note" id="cpmsg" aria-live="polite"></p></div>`;
    const f=$("#flip"); if(f) f.onclick=()=>{shown=!shown;draw()};
    const mark=ok=>{const c=all[pool()[pos]]; if(ok) known.add(c.key); else known.delete(c.key); store.set(sk,[...known]); shown=false; if(!(onlyNew&&ok)) pos++; draw();};
    if($("#yes")){$("#yes").onclick=()=>mark(true);$("#no").onclick=()=>mark(false);}
    $("#filter").onclick=()=>{onlyNew=!onlyNew;pos=0;shown=false;draw()};
    $("#shuf").onclick=()=>{order.sort(()=>Math.random()-.5);pos=0;shown=false;draw()};
    $("#reset").onclick=()=>{known=new Set();store.set(sk,[]);pos=0;shown=false;draw()};
    const copy=(txt,label)=>{const ta=$("#exp");ta.hidden=false;ta.value=txt;
      const ok=()=>$("#cpmsg").textContent=label+" nukopijuota. Anki: File → Import → įklijuotas tekstas, išsaugotas kaip .txt.";
      const fail=()=>{ta.focus();ta.select();$("#cpmsg").textContent="Nepavyko nukopijuoti automatiškai. Tekstas pažymėtas – nukopijuok jį rankiniu būdu.";};
      try{navigator.clipboard.writeText(txt).then(ok,fail)}catch(e){fail()}};
    $("#cpq").onclick=()=>copy(t.cards.filter(c=>c.t==="qa").map(c=>[c.q,c.a,c.tags].join("\t")).join("\n"),"Basic kortelės");
    $("#cpc").onclick=()=>copy(t.cards.filter(c=>c.t==="cloze").map(c=>[c.x,"",c.tags].join("\t")).join("\n"),"Cloze kortelės");
  }
  draw();
}

/* ---------- testas ---------- */
function renderTest(pane,t){
  const sk="best:"+t.id;
  let ans={};
  function draw(){
    const n=t.test.length, done=Object.keys(ans).length, right=Object.entries(ans).filter(([i,a])=>t.test[i].c===a).length;
    const best=store.get(sk,null);
    pane.innerHTML=`<div class="score"><span><b>${right} / ${n}</b> <span class="pill">teisingai · atsakyta ${done}</span></span><span class="pill">${best!==null?"Geriausias: "+best+" / "+n:""}</span></div>
    ${t.test.map((q,i)=>{const a=ans[i];return `<div class="qcard"><div class="qn">${i+1} klausimas</div><h4>${esc(q.q)}</h4><div class="opts">${q.o.map((o,j)=>{
      let cls=""; if(a!==undefined){ if(j===q.c) cls="ok"; else if(j===a) cls="no"; }
      return `<button class="opt ${cls}" data-q="${i}" data-o="${j}" ${a!==undefined?"disabled":""}><span class="l">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>${a!==undefined?`<div class="expl"><b>${a===q.c?"Teisingai.":"Neteisingai."}</b> ${esc(q.e)}</div>`:""}</div>`}).join("")}
    ${done===n?`<div class="result"><h3>Rezultatas: ${right} / ${n} (${Math.round(right/n*100)} %)</h3><p>${right/n>=.85?"Puikiai – tema įsisavinta.":right/n>=.6?"Neblogai. Pakartok klaidingus klausimus ir korteles.":"Grįžk į konspektą ir korteles, tada bandyk dar kartą."}</p><p style="margin-top:12px"><button class="btn" id="again">Bandyti iš naujo</button></p></div>`:""}`;
    pane.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{ans[b.dataset.q]=+b.dataset.o;
      if(Object.keys(ans).length===n){const r=Object.entries(ans).filter(([i,a])=>t.test[i].c===a).length; if(best===null||r>best) store.set(sk,r);}
      const y=window.scrollY; draw(); window.scrollTo(0,y);});
    const ag=$("#again"); if(ag) ag.onclick=()=>{ans={};draw();window.scrollTo(0,0)};
  }
  draw();
}

/* ---------- progresas ---------- */
let progFilter="all", resetArm=false;
function progMap(M){ M=M||curMod(); const k="progress:"+M.id; const v=store.get(k,null); return v!==null? v : (M.id==="skpkl"? store.get("progress",{}) : {}); }
function progSave(M,v){ store.set("progress:"+M.id,v); }
function progAll(){ let n=0,d=0; MODULES.forEach(M=>{const s=progStats(M.syl.flatMap(b=>b.items),M); n+=s.n; d+=s.d;}); return {pct:n?Math.round(d/n*100):0}; }
function progStats(items,M){ const m=progMap(M); let d=0,w=0; items.forEach(it=>{const s=m[it[0]]||0; if(s===2)d++; else if(s===1)w++;}); const n=items.length; return {n,d,w,pct:n?Math.round(d/n*100):0, pw:n?w/n*100:0, pd:n?d/n*100:0}; }
function renderProgress(v,M){
  const SY=M.syl; const m=progMap(M); const all=SY.flatMap(b=>b.items); const S=progStats(all,M);
  v.innerHTML=`<div class="p-hero"><div class="p-big">${S.pct}<small> %</small></div><div><h2>Išmokta ${S.d} iš ${S.n} temų</h2><p>Dar mokaisi: ${S.w} · Neliesta: ${S.n-S.d-S.w}</p>
   <div class="sbar" role="img" aria-label="Išmokta ${S.pct} procentų"><i class="g" style="width:${S.pd}%"></i><i class="y" style="width:${S.pw}%"></i></div>
   <div class="p-legend"><em style="--sw:var(--good)">Išmokta</em><em style="--sw:var(--warn)">Mokausi</em><em style="--sw:var(--line)">Neliesta</em></div></div></div>
  <div class="p-tools"><div class="seg" role="group" aria-label="Rodyti"><button data-f="all" aria-pressed="${progFilter==="all"}">Visos temos</button><button data-f="todo" aria-pressed="${progFilter==="todo"}">Neišmoktos</button></div>
   <button class="btn" id="preset">${resetArm?"Tikrai išvalyti? Spausk dar kartą":"Išvalyti žymes"}</button></div>
  <p class="note" style="margin:0 0 12px">Bakstelk būseną šalia temos: Neliesta → Mokausi → Išmokta. Žymės saugomos šioje naršyklėje.</p>
  ${SY.map(b=>{const s=progStats(b.items,M); const rows=b.items.filter(it=>progFilter==="all"||(m[it[0]]||0)!==2);
    return `<section class="blk" style="--c:${b.c}"><div class="blk-head"><h3>${b.name}</h3><span class="pct">${s.pct} %</span>
     <div class="sbar"><i class="g" style="width:${s.pd}%"></i><i class="y" style="width:${s.pw}%"></i></div><span class="sub">Išmokta ${s.d} iš ${s.n} · mokausi ${s.w}</span></div>
     ${rows.length?rows.map(it=>{const k=m[it[0]]||0; const link=it[2]?` <a href="#" data-open="${it[0]}">medžiaga →</a>`:"";
       return `<div class="trow s${k}"><span class="no">${it[0]}</span><span class="tt">${esc(it[1])}${link}</span><button class="st s${k}" data-id="${it[0]}" aria-label="${esc(it[0]+" "+it[1])}: ${ST_NAMES[k]}. Pakeisti būseną">${ST_NAMES[k]}</button></div>`;}).join(""):`<div class="trow"><span></span><span class="tt note">Visos šios srities temos išmoktos.</span></div>`}
    </section>`;}).join("")}`;
  v.querySelectorAll(".st").forEach(b=>b.onclick=()=>{const mm=progMap(M); const id=b.dataset.id; mm[id]=((mm[id]||0)+1)%3; if(!mm[id]) delete mm[id]; progSave(M,mm); resetArm=false; const y=window.scrollY; render(); window.scrollTo(0,y);});
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{progFilter=b.dataset.f; resetArm=false; render();});
  $("#preset").onclick=()=>{ if(resetArm){progSave(M,{}); resetArm=false;} else resetArm=true; render(); };
  v.querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault(); const it=all.find(x=>x[0]===a.dataset.open); const L=it[2]; st.area=L.area; st.sub=L.sub; st.topic=L.topic; st.mode="notes"; render(); window.scrollTo(0,0);});
}

/* ---------- modulių pasirinkimas ---------- */
function renderModules(v){
  const hr=new Date().getHours(); const greet=hr<11?"Labas rytas":hr<18?"Laba diena":"Labas vakaras";
  const cur=MODULES[0], dl=daysLeft(cur.until), tot=modTopics(cur).length;
  const allS=progAll();
  v.innerHTML = `<section class="hero"><div class="hi">${greet}</div><h2>Mokomės, <em>daktaryte</em>.</h2>
    <p>Pasirink modulį ir toliau mokykis iš konspektų, kortelių ar testų.</p>
    <div class="stats"><span><b>${dl>0?dl:0}</b> d. iki modulio pabaigos</span><span><b>${tot}</b> temos su medžiaga</span><span><b>${allS.pct} %</b> išmokta</span></div>
    <svg class="ecg" viewBox="0 0 860 56" preserveAspectRatio="none" aria-hidden="true"><path d="${ECG_PATH}"/></svg></section>
  <p class="section-label">Pasirink modulį</p><div class="mods">${MODULES.map(M=>{
    const s=progStats(M.syl.flatMap(b=>b.items),M); const due=dueLabel(M.until);
    const n=count(modTopics(M), st.mode==="progress"?"notes":st.mode);
    return `<button class="mod" data-mod="${M.id}"><svg class="trace" viewBox="0 0 200 70" aria-hidden="true"><path d="M0 40 H60 l6 10 l10 -45 l10 52 l8 -17 H200"/></svg><span class="eyebrow"><span class="due ${due.late?"late":""}">${due.txt}</span><span>${M.areas.length} sritys · ${n} ${unit(st.mode==="progress"?"notes":st.mode)}</span></span>
      <h2>${esc(M.name)}</h2>
      <span class="meta">${M.areas.map(a=>`<span style="background:${a.cs}">${esc(a.name)}</span>`).join("")}</span>
      <span class="foot"><span class="sbar" role="img" aria-label="Išmokta ${s.pct} procentų"><i class="g" style="width:${s.pd}%"></i><i class="y" style="width:${s.pw}%"></i></span><b>${s.pct} %</b></span></button>`;}).join("")}
    <div class="empty"><b>Kitas modulis</b> atsiras čia, kai prasidės. Atsiųsk Claude jo aprašą ar skaidres.</div></div>`;
  v.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{st.module=b.dataset.mod; st.area=st.sub=st.topic=null; render(); window.scrollTo(0,0);});
}

render();
</script>
</body></html>
